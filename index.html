<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Herramientas Malhuayza Motors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Portada: foto de la fachada a todo lo ancho, título de marca y tarjetas de herramientas que suben sobre la foto. */
:root{
  --bg:#EEF0F3; --panel:#FFFFFF; --fg:#16191D; --muted:#5B6570; --line:#D9DDE2;
  --red:#E3141D; --red-ink:#B70F17; --night:#0E1013;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#0F1114;--panel:#181B1F;--fg:#E7E9EC;--muted:#9AA3AD;--line:#2A2F35;--red-ink:#FF5A60;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.hero{position:relative;background:var(--night) 75% 40%/cover no-repeat;color:#fff;min-height:440px;display:flex}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(10,11,14,.96) 0%,rgba(10,11,14,.9) 42%,rgba(10,11,14,.45) 72%,rgba(10,11,14,.2) 100%),linear-gradient(0deg,rgba(10,11,14,.85) 0%,rgba(10,11,14,0) 45%)}
.hero-in{position:relative;width:100%;max-width:1180px;margin:0 auto;padding:36px 20px 120px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.hero img.logo{width:min(320px,80%);height:auto;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
.kicker{font-family:var(--f-display);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:14px;color:#FF6B70;margin:6px 0 0}
h1{font-family:var(--f-display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(38px,6vw,64px);line-height:.95;margin:0;letter-spacing:.01em;text-wrap:balance;max-width:12ch}
h1 span{display:block}
h1 span{color:var(--red);text-shadow:0 2px 14px rgba(0,0,0,.5)}
.lead{max-width:46ch;color:#D3D7DC;margin:0;font-size:16px}
.tools{position:relative;max-width:1180px;margin:-84px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.tool{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;text-decoration:none;color:inherit;box-shadow:0 10px 30px rgba(10,11,14,.14);transition:transform .15s,box-shadow .15s}
.tool:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(10,11,14,.2)}
.tool:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.ic{width:46px;height:46px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center}
.ic svg{width:26px;height:26px}
.tool h2{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;line-height:1}
.tool p{margin:0;color:var(--muted);font-size:14px}
.go{margin-top:auto;font-weight:600;color:var(--red-ink);font-size:14px}
.foot{max-width:1180px;margin:44px auto 0;padding:22px 20px 32px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:18px 40px;font-size:13.5px;color:var(--muted)}
.foot b{display:block;color:var(--fg);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
@media (max-width:600px){.hero{min-height:380px}.hero-in{padding:28px 16px 110px}.tools{padding:0 16px}.foot{padding-left:16px;padding-right:16px}}
@media (prefers-reduced-motion:reduce){.tool{transition:none}}
</style>
</head>
<body data-tool="inicio">
<script src="logo.js"></script>
<script src="marca.js"></script>
<script src="comun/menu.js"></script>

<header class="hero mm-photo">
  <div class="hero-in">
    <img class="logo" id="logo" alt="Malhuayza Motors" hidden>
    <p class="kicker">La casa del motociclista · Huamanga</p>
    <h1>Herramientas <span>de la tienda</span></h1>
    <p class="lead">Elige lo que necesitas hacer. Todo funciona desde el navegador, en la PC o en el celular.</p>
  </div>
</header>

<main class="tools" id="tools"></main>

<footer class="foot" id="foot"></footer>

<script>
(function(){
  var esc = function(s){ return String(s || "").replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
  if (window.MARCA_LOGO){ var l = document.getElementById("logo"); l.src = window.MARCA_LOGO; l.hidden = false; }
  var MM = window.MM || {herramientas: [], base: "./"};
  document.getElementById("tools").innerHTML = MM.herramientas.map(function(t){
    return '<a class="tool" href="' + t.ruta + '"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">' + t.icono + '</svg></span><h2>' + esc(t.titulo) + '</h2><p>' + esc(t.desc) + '</p><span class="go">Abrir →</span></a>';
  }).join("");
  var M = window.MARCA || {};
  var tiendas = ["TIENDA PRINCIPAL: JR. AMÉRICO ORÉ 155"].concat((M.direcciones || "").split("\n").filter(Boolean));
  document.getElementById("foot").innerHTML =
    '<div><b>Tiendas</b>' + tiendas.map(esc).join("<br>") + '</div>' +
    '<div><b>Contacto</b>' + (M.telefonos ? "Tel. " + esc(M.telefonos) + "<br>" : "") + (M.whatsapp ? "WhatsApp " + esc(M.whatsapp) : "") + '</div>' +
    '<div><b>Inversiones Malhuayza E.I.R.L.</b>RUC 20534497351</div>';
})();
</script>
</body>
</html>
